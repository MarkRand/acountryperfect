baseurl: /
defaultContentLanguage: en
locale: en-AU
title: A Country Perfect
theme: hugo-theme-stack

pagination:
    pagerSize: 10

params:
    mainSections:
        - post
        - episodes
        - show
        - characters
    featuredImageField: image
    rssFullContent: true
    favicon:

    footer:
        since: 2020
        customText: "A tribute and retrospective for the classic Australian television drama A Country Practice (1981 - 1993)."

    dateFormat:
        published: Jan 02, 2006
        lastUpdated: Jan 02, 2006 15:04 MST

    sidebar:
        subtitle: A fan tribute and comprehensive archive for the TV series A Country Practice
        avatar:
            enabled: true
            local: true
            src: img/acp_square_title.png

    article:
        math: false
        toc: true
        readingTime: true
        license:
            enabled: true
            default: Licensed under CC BY-NC-SA 4.0

    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 5
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10

    colorScheme:
        toggle: true
        default: auto

    imageProcessing:
        cover:
            enabled: true
        content:
            enabled: true

menu:
    main:
        - identifier: home
          name: Home
          url: /
          weight: -100
          params:
              icon: home

markup:
    goldmark:
        extensions:
            passthrough:
                enable: true
                delimiters:
                    block:
                        - - \[
                          - \]
                        - - $$
                          - $$
                    inline:
                        - - \(
                          - \)
        renderer:
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4
